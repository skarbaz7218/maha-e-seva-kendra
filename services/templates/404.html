 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found | Maha e Seva Kendra Kandhar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-box {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(16, 24, 40, 0.08);
            max-width: 500px;
        }
        .error-code {
            font-size: 100px;
            font-weight: 900;
            color: #2563eb;
            line-height: 1;
            margin-bottom: 20px;
        }
        h1 {
            color: #101828;
            font-size: 28px;
            margin-bottom: 12px;
        }
        p {
            color: #667085;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(135deg, #2563eb, #123b8f);
            color: white;
            text-decoration: none;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s ease;
        }
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.28);
        }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Sorry, the page you are looking for does not exist.</p>
        <a href="/">← Back to Home</a>
    </div>
</body>
</html>
